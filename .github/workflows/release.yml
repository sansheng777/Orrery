# A release (docs/architecture.md, "Releases"), started either way:
# - by pushing a tag such as v1.2.3, or
# - from the Actions tab: release > Run workflow on main, with "publish" ticked. It releases the version in
#   package.json and creates its tag. Unticked, it is a dry run: everything is checked and built, nothing
#   is published.
# Then it:
# 1. checks that the tag matches every package.json and has a section in CHANGELOG.md, and runs the tests;
# 2. publishes the image ghcr.io/<owner>/orrery:1.2.3, and :latest unless it is a pre-release (v1.2.3-rc.1);
# 3. creates the GitHub release: the CHANGELOG.md section as notes, install.sh (which installs this
#    release), orrery.html (the dashboard) and SHA256SUMS;
# 4. signs build provenance for the image and the files, which `gh attestation verify` checks.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in package.json and create its tag. Leave unticked for a dry run.
        type: boolean
        default: false
permissions:
  contents: write # the GitHub release
  packages: write # the image
  id-token: write # signing the provenance
  attestations: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Version
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag=$GITHUB_REF_NAME; else tag="v$(node -p 'require("./package.json").version')"; fi
          if [ "$GITHUB_EVENT_NAME" != push ] && [ "$PUBLISH" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Publish from main only"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "::error::$tag is already released. Raise the version first."; exit 1; fi
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orrery"
            if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Release notes, and the version checks
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: node scripts/release-notes.mjs "$TAG" > notes.md && cat notes.md
      - run: npm ci && npm test
      - name: Release files
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir dist
          sed "s/^RELEASE=\"\"$/RELEASE=\"$TAG\"/" deploy/install.sh > dist/install.sh
          grep -qx "RELEASE=\"$TAG\"" dist/install.sh
          bash -n dist/install.sh
          cp dashboard/orrery.html dist/
          (cd dist && sha256sum install.sh orrery.html > SHA256SUMS && cat SHA256SUMS)
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ steps.v.outputs.prerelease == 'false' }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        if: env.PUBLISH == 'true'
        with:
          subject-name: ${{ steps.v.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v4
        if: env.PUBLISH == 'true'
        with:
          subject-path: dist/*
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          args=(--title "Orrery $VERSION" --notes-file notes.md)
          [ "$PRERELEASE" = false ] || args+=(--prerelease)
          # A pushed tag must exist already; from the Actions tab the release creates it on this commit.
          if [ "$GITHUB_EVENT_NAME" = push ]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" dist/* "${args[@]}"
